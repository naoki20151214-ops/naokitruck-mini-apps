<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在庫チェック</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="container">
    <h1>在庫チェック</h1>
    <p class="lead">KADOKAWAストアと MINTモール の在庫状況を確認できます。</p>

    <section class="card" aria-live="polite">
      <p class="label">現在の判定</p>
      <div id="status-list" class="status-list">
        <p class="meta">読み込み中...</p>
      </div>
      <p id="updated-at" class="meta"></p>
      <p class="meta">※ 「要確認」の場合は自動判定できていないため、商品ページで在庫表示を確認してください。</p>
    </section>

    <button id="refresh" type="button">最新データを再読み込み</button>
    <p class="notice">※ GitHub Pagesでは直接スクレイピングせず、GitHub Actionsで更新したJSONを表示しています。</p>
  </main>

  <script src="./script.js" defer></script>
</body>
</html>
